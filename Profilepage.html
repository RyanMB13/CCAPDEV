<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        .profile-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-info img {
            border-radius: 50%;
            margin-right: 20px;
        }

        .user-details {
            flex-grow: 1;
        }

        .user-details h2 {
            margin: 0;
            color: #333;
        }

        .user-details p {
            color: #555;
        }

        .user-actions {
            margin-top: 20px;
        }

        .user-actions button {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .user-posts {
            margin-top: 30px;
        }

        .post {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .post p {
            color: #333;
        }

        .badges {
            margin-top: 30px;
        }

        .badge {
            display: inline-block;
            background-color: #e0e0e0;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    
    <header>
        <h1>User Profile</h1>
    </header>

    <main>

        
        <div class="profile-info">
            <img src="blank-profile-picture-973460_1280.png" alt="User Avatar" width="80" height="80">
            <div class="user-details">
                <h2>John Doe</h2>
                <p>Computer Science Student</p>
            </div>
        </div>

        <div class="user-actions">
            <button>Edit Profile</button>
        </div>

        <div class="user-posts">
            <h2>User Posts</h2>
            <div class="post">
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam vel ex eget libero fermentum bibendum vel vel justo.</p>
            </div>
            <!-- Add more posts as needed -->
        </div>

        <div class="badges">
            <h2>Badges</h2>
            <div class="badge">DLSU Studnet</div>
            <div class="badge">DLSU Student Goverment Member</div>
            <!-- Add more badges as needed -->
        </div>
    </main>

</body>
</html>
