<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form class="login-form" action="mainpage.html" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="save_password" name="save_password">
                <label class="form-check-label" for="save_password">Remember me</label>
            </div>
            <div class="form-group">
                <button type="submit" class="btn-outline-success">Login</button>
            </div>
            <div class="form-register">
                <span>Don't have an account?</span>
                <a href="register.html">Register</a>
            </div>
            <div class="form-back">
              <a href="mainpage.html">Back to Main Page</a>
            </div>
        </form>
    </div>
</body>
</html>
